<div class="container d-flex justify-content-center aling-items-center my-5">
    <div class="card p-4 shadow-sm" style="width: 25rem;">
        <h3 class="text-center mb-4">Iniciar Sesión</h3>
        <form #f="ngForm" (ngSubmit)="f.form.valid && login(f)">
            <!-- Campo de Email -->
             <div class="mb-3">
                <input type="email" class="form-control" id="email" name="email" placeholder="email" ngModel required />
             </div>
             <!-- Campo de contraseña -->
              <div class="mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="********" ngModel required />
              </div>
              <!-- Boton -->
               <button class="btn btn-primary w-100" type="submit">Iniciar Sesión</button>
        </form>
    </div>
</div>
