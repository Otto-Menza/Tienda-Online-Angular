<div class="container text-center">
  <h1 class="text-info text-center">{{title()}}</h1>
  <!-- Botones/enlaces para login y logout -->
  <div class="d-flex justify-content-center my-3">
    @if(!isAutenticado()){
      <a [routerLink]="['/login']" class="btn btn-outline-primary mx-2">Entrar</a>
    } @else {
      <a style="cursor: pointer" class="btn btn-outline-danger mx-3" (click)="salir()">Salir</a>
    }
  </div>

  <router-outlet/>
</div>
